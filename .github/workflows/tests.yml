name: 测试

# ★ 这个 workflow **只跑测试**，不改任何东西：
#   - 不推分支（`git push` 一律不许出现）
#   - 不定时触发（schedule 会在没人看着的时候自己跑，还可能失败）
#   - 不碰 data/ 与 site/（发布走 scripts/deploy.sh，由 Mavis cron 负责）
#
# 为什么需要它：Worker 的校验逻辑、三个子页的投递逻辑，
# 以前**没有任何自动化在跑**（只有 Mavis cron 在发奖，它不跑测试）
# ⇒ 改坏了要等姜来手动点一次页面才发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ★ node 是 Worker 那两份规格的运行环境
      #   （tests/worker_validate_spec.js / tests/worker_handler_spec.mjs，
      #     由 tests/test_worker_node_spec.py 接进 Python 测试里跑）
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 装 playwright（浏览器层的断言要它）
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # ★ fengari —— KOReader 插件的 Lua 单测要它（不装 ⇒ 那 19 条会被**静默跳过**）
      - name: 装 fengari（KOReader 插件的 Lua 运行环境）
        run: npm ci

      # ★ 宝可梦素材缓存 —— 进化链的**真实数据**测试要它（不拉 ⇒ 那 9 条会被静默跳过）
      - name: 拉宝可梦素材缓存（真实数据测试用）
        run: |
          mkdir -p .cache
          git clone --depth 1 https://github.com/42arch/pokemon-dataset-zh.git \
            .cache/pokemon-dataset-zh

      - name: 跑整套测试
        shell: bash
        run: python3 -B run_tests.py 2>&1 | tee test.log

      # ★★ **不许有测试被静默跳过** ——
      #   跳过不算失败 ⇒ 少测 28 条也是「绿的」⇒ 等于没测。
      #   （依赖没装好时 unittest 会 skip 而不是 error —— 这是最容易骗过 CI 的地方。）
      - name: 检查有没有测试被跳过
        run: |
          python3 - <<'EOF'
          import re, sys
          text = open('test.log', encoding='utf-8', errors='replace').read()
          m = re.search(r'skipped=(\d+)', text)
          n = int(m.group(1)) if m else -1
          if n != 0:
              print('有 %s 条测试被跳过 —— CI 没测到它们（依赖装好了吗？）' % n)
              sys.exit(1)
          print('全部测试都跑了，没跳过。')
          EOF
